name: Detekt Distributed AOT Cache

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      single_aot_jdk:
        description: 'JDK version used for single.aot and the no-AOT baseline'
        required: false
        default: '24'
        type: choice
        options:
          - '25'
          - '24'

jobs:
  tree-combine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: true

      - name: Download custom JDK
        uses: ./.github/actions/download-custom-jdk

      - name: Set up custom JDK
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: jdkfile
          java-version: '25'
          jdkFile: jdk-custom.tar.gz

      - name: Cache Maven dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-detekt-${{ hashFiles('detekt-experiment/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-detekt-
            ${{ runner.os }}-maven-

      # ── install detekt modules into local Maven repo ───────────────────────

      - name: Install detekt modules (skip tests)
        working-directory: detekt-experiment
        run: |
          set -euo pipefail
          chmod +x install-all.sh
          ./install-all.sh

      # ── build module caches (tree-merge) ──────────────────────────────────

      - name: Build detekt-parser cache (tree-merge)
        working-directory: detekt-experiment/detekt/detekt-parser
        run: |
          set -euo pipefail
          find . -name "*.aot" -o -name "aot.map" | xargs rm -f 2>/dev/null || true
          mvn clean test -P tree-merge -q
          test -f cache.aot

      - name: Build detekt-rules-complexity cache (tree-merge)
        working-directory: detekt-experiment/detekt/detekt-rules-complexity
        run: |
          set -euo pipefail
          find . -name "*.aot" -o -name "aot.map" | xargs rm -f 2>/dev/null || true
          mvn clean test -P tree-merge -q
          test -f cache.aot

      - name: Build detekt-rules-style cache (tree-merge)
        working-directory: detekt-experiment/detekt/detekt-rules-style
        run: |
          set -euo pipefail
          find . -name "*.aot" -o -name "aot.map" | xargs rm -f 2>/dev/null || true
          mvn clean test -P tree-merge -q
          test -f cache.aot

      - name: Build detekt-rules-naming cache (tree-merge)
        working-directory: detekt-experiment/detekt/detekt-rules-naming
        run: |
          set -euo pipefail
          find . -name "*.aot" -o -name "aot.map" | xargs rm -f 2>/dev/null || true
          mvn clean test -P tree-merge -q
          test -f cache.aot

      - name: Build detekt-rules-errorprone cache (tree-merge)
        working-directory: detekt-experiment/detekt/detekt-rules-errorprone
        run: |
          set -euo pipefail
          find . -name "*.aot" -o -name "aot.map" | xargs rm -f 2>/dev/null || true
          mvn clean test -P tree-merge -q
          test -f cache.aot

      - name: Build detekt-rules-coroutines cache (tree-merge)
        working-directory: detekt-experiment/detekt/detekt-rules-coroutines
        run: |
          set -euo pipefail
          find . -name "*.aot" -o -name "aot.map" | xargs rm -f 2>/dev/null || true
          mvn clean test -P tree-merge -q
          test -f cache.aot

      - name: Build detekt-rules-exceptions cache (tree-merge)
        working-directory: detekt-experiment/detekt/detekt-rules-exceptions
        run: |
          set -euo pipefail
          find . -name "*.aot" -o -name "aot.map" | xargs rm -f 2>/dev/null || true
          mvn clean test -P tree-merge -q
          test -f cache.aot

      - name: Build detekt-rules-empty cache (tree-merge)
        working-directory: detekt-experiment/detekt/detekt-rules-empty
        run: |
          set -euo pipefail
          find . -name "*.aot" -o -name "aot.map" | xargs rm -f 2>/dev/null || true
          mvn clean test -P tree-merge -q
          test -f cache.aot

      - name: Build detekt-rules-performance cache (tree-merge)
        working-directory: detekt-experiment/detekt/detekt-rules-performance
        run: |
          set -euo pipefail
          find . -name "*.aot" -o -name "aot.map" | xargs rm -f 2>/dev/null || true
          mvn clean test -P tree-merge -q
          test -f cache.aot

      - name: Build detekt-rules-documentation cache (tree-merge)
        working-directory: detekt-experiment/detekt/detekt-rules-documentation
        run: |
          set -euo pipefail
          find . -name "*.aot" -o -name "aot.map" | xargs rm -f 2>/dev/null || true
          mvn clean test -P tree-merge -q
          test -f cache.aot

      - name: Build detekt-core cache (tree-merge)
        working-directory: detekt-experiment/detekt/detekt-core
        run: |
          set -euo pipefail
          find . -name "*.aot" -o -name "aot.map" | xargs rm -f 2>/dev/null || true
          mvn clean test -P tree-merge -q
          test -f cache.aot

      # ── single.aot (Temurin — standard JDK for no-AOT baseline) ──────────

      - name: Set up JDK ${{ inputs.single_aot_jdk || '24' }} (no-AOT baseline and single.aot)
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.single_aot_jdk || '24' }}

      - name: Capture Temurin JDK path
        run: echo "TEMURIN_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Create single.aot per workload (JDK ${{ inputs.single_aot_jdk || '24' }})
        working-directory: detekt-experiment
        run: |
          set -euo pipefail
          chmod +x create-single-aot.sh
          for op in analyze-complexity analyze-style analyze-naming analyze-bugs analyze-coroutines; do
            ./create-single-aot.sh "$op"
            test -f "single-${op}.aot"
          done

      # ── tree.aot (custom JDK — has AOTMergeInputs) ────────────────────────

      - name: Re-enable custom JDK
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: jdkfile
          java-version: '25'
          jdkFile: jdk-custom.tar.gz

      - name: Create tree.aot (orchestrate-combine.sh)
        working-directory: detekt-experiment
        run: |
          set -euo pipefail
          chmod +x orchestrate-combine.sh
          combine_out=$(./orchestrate-combine.sh 2>&1) || { echo "$combine_out"; exit 1; }
          echo "$combine_out"
          combine_out_clean=$(echo "$combine_out" | sed 's/\x1B\[[0-9;]*m//g')
          tree_size=$(du -h tree.aot | awk '{print $1}')
          {
            echo "## tree.aot creation (orchestrate-combine)"
            echo
            echo "- tree.aot: ${tree_size}"
            echo
            echo '```'
            echo "$combine_out_clean"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test -f tree.aot

      # ── timed workload ─────────────────────────────────────────────────────

      - name: Run timed workload
        working-directory: detekt-experiment
        run: |
          set -euo pipefail
          chmod +x workload-timed.sh
          wl_out=$(JAVA_NO_BIN="$TEMURIN_JAVA_HOME/bin/java" \
                   JAVA_SINGLE_BIN="$TEMURIN_JAVA_HOME/bin/java" \
                   JAVA_TREE_BIN="$JAVA_HOME/bin/java" \
                   ./workload-timed.sh 2>&1) || { echo "$wl_out"; exit 1; }
          echo "$wl_out"
          wl_out_clean=$(echo "$wl_out" | sed 's/\x1B\[[0-9;]*m//g')
          single_size=$(du -ch single-*.aot | tail -1 | awk '{print $1}')
          tree_size=$(du -h tree.aot | awk '{print $1}')
          {
            echo "## Timed workload results (no-AOT vs single vs tree)"
            echo
            echo "- single-*.aot total: ${single_size}"
            echo "- tree.aot: ${tree_size}"
            echo
            echo '```'
            echo "$wl_out_clean"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append LaTeX table rows to summary
        working-directory: detekt-experiment
        run: |
          {
            echo "## LaTeX table rows (single=AOTCache, tree=TreeCache)"
            echo
            echo '```latex'
            cat workload-tmp/latex-rows.tex
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append AOT cache composition table to summary
        working-directory: detekt-experiment
        run: |
          {
            echo "## AOT cache composition (Size / Classes / App%)"
            echo
            echo '```latex'
            python3 generate-latex-table.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate UpSet overlap plot
        working-directory: detekt-experiment
        run: |
          pip install --quiet upsetplot matplotlib "pandas<2.2" numpy
          python3 plot-upset.py

      # ── artifact summary ───────────────────────────────────────────────────

      - name: Write artifact summary
        working-directory: detekt-experiment
        run: |
          {
            echo "## Distributed AOT artifact summary"
            echo
            echo "| Artifact | Cache path | Size |"
            echo "|---|---|---|"
            for mod in detekt-rules-complexity detekt-rules-style detekt-rules-naming \
                       detekt-rules-errorprone detekt-rules-coroutines detekt-rules-exceptions \
                       detekt-rules-empty detekt-rules-performance detekt-rules-documentation \
                       detekt-core detekt-parser; do
              echo "| ${mod} | \`detekt/${mod}/cache.aot\` | $(du -h "detekt/${mod}/cache.aot" | awk '{print $1}') |"
            done
            for op in analyze-complexity analyze-style analyze-naming analyze-bugs analyze-coroutines; do
              echo "| single-${op} | \`single-${op}.aot\` | $(du -h "single-${op}.aot" | awk '{print $1}') |"
            done
            echo "| tree | \`tree.aot\` | $(du -h tree.aot | awk '{print $1}') |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── upload ─────────────────────────────────────────────────────────────

      - name: Upload detekt workload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: detekt-tree-artifacts
          path: |
            detekt-experiment/workload-tmp/
            detekt-experiment/aot.map
            detekt-experiment/single-*.aot
            detekt-experiment/tree.aot
            detekt-experiment/upset-tree-overlap.pdf
            detekt-experiment/detekt/detekt-rules-complexity/cache.aot
            detekt-experiment/detekt/detekt-rules-complexity/aot.map
            detekt-experiment/detekt/detekt-rules-style/cache.aot
            detekt-experiment/detekt/detekt-rules-style/aot.map
            detekt-experiment/detekt/detekt-rules-naming/cache.aot
            detekt-experiment/detekt/detekt-rules-naming/aot.map
            detekt-experiment/detekt/detekt-rules-errorprone/cache.aot
            detekt-experiment/detekt/detekt-rules-errorprone/aot.map
            detekt-experiment/detekt/detekt-rules-coroutines/cache.aot
            detekt-experiment/detekt/detekt-rules-coroutines/aot.map
            detekt-experiment/detekt/detekt-rules-exceptions/cache.aot
            detekt-experiment/detekt/detekt-rules-exceptions/aot.map
            detekt-experiment/detekt/detekt-rules-empty/cache.aot
            detekt-experiment/detekt/detekt-rules-empty/aot.map
            detekt-experiment/detekt/detekt-rules-performance/cache.aot
            detekt-experiment/detekt/detekt-rules-performance/aot.map
            detekt-experiment/detekt/detekt-rules-documentation/cache.aot
            detekt-experiment/detekt/detekt-rules-documentation/aot.map
            detekt-experiment/detekt/detekt-core/cache.aot
            detekt-experiment/detekt/detekt-core/aot.map
            detekt-experiment/detekt/detekt-parser/cache.aot
            detekt-experiment/detekt/detekt-parser/aot.map
          if-no-files-found: error
