name: Batik Distributed AOT Cache

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      single_aot_jdk:
        description: 'JDK version used for single.aot and the no-AOT baseline'
        required: false
        default: '24'
        type: choice
        options:
          - '25'
          - '24'

jobs:
  tree-combine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: true

      - name: Download custom JDK
        uses: ./.github/actions/download-custom-jdk

      - name: Set up custom JDK
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: jdkfile
          java-version: '25'
          jdkFile: jdk-custom.tar.gz

      - name: Cache Maven dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-batik-${{ hashFiles('batik-experiment/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-batik-
            ${{ runner.os }}-maven-

      # batik-test-old depends on all batik-* sibling modules, and benchmark
      # depends on batik-transcoder. Install the full reactor first so both can
      # resolve their deps from the local Maven repo without network access.
      - name: Install batik modules into local Maven repo
        working-directory: batik-experiment/batik
        run: mvn install -DskipTests -Drat.skip -q

      # ── AOT cache creation + build overhead measurement ────────────────────
      # measure-build-overhead.sh runs each module twice (baseline then with
      # cache generation) to compute the overhead delta, then runs
      # orchestrate-combine.sh to produce tree.aot.  All .aot files needed by
      # subsequent steps are a side-effect of the script.

      - name: Build benchmark fat jar
        working-directory: batik-experiment/benchmark
        run: mvn package -DskipTests -Drat.skip -q

      - name: Measure build overhead and create tree.aot
        working-directory: batik-experiment
        run: |
          set -euo pipefail
          chmod +x measure-build-overhead.sh
          overhead_out=$(./measure-build-overhead.sh 2>&1) \
            || { echo "$overhead_out"; exit 1; }
          echo "$overhead_out"
          overhead_out_clean=$(echo "$overhead_out" | sed 's/\x1B\[[0-9;]*m//g')

          tree_size=$(du -h tree.aot | awk '{print $1}')

          {
            echo "## Build overhead (baseline vs with AOT cache generation)"
            echo
            echo "- tree.aot: ${tree_size}"
            echo
            echo '```'
            echo "$overhead_out_clean"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Append the Markdown + LaTeX table produced by the script
          python3 - <<'EOF'
          import os, subprocess, sys

          tsv_path = "build-overhead.tsv"
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]

          rows = []
          with open(tsv_path) as f:
              for line in f:
                  parts = line.rstrip("\n").split("\t")
                  module, ctype = parts[0], parts[1]
                  baseline_ms, cache_ms, overhead_ms = int(parts[2]), int(parts[3]), int(parts[4])
                  rows.append((module, ctype, baseline_ms, cache_ms, overhead_ms))

          total_b = sum(r[2] for r in rows)
          total_c = sum(r[3] for r in rows)
          total_o = sum(r[4] for r in rows)

          def pct(o, b):
              return f"{o/b*100:+.1f}%" if b else "—"

          md_rows = "\n".join(
              f"| {m} | {ct} | {'—' if b == 0 else f'{b/1000:.1f}'} | {c/1000:.1f} | {o/1000:.1f} | {pct(o, b)} |"
              for m, ct, b, c, o in rows
          )
          total_pct = pct(total_o, total_b)

          latex_lines = [
              r"\begin{tabular}{llrrrr}",
              r"\toprule",
              r"Module & Cache Type & Baseline (s) & With Cache (s) & Overhead (s) & \% Increase \\",
              r"\midrule",
          ]
          for m, ct, b, c, o in rows:
              b_s = r"\textemdash" if b == 0 else f"{b/1000:.1f}"
              pct_s = r"\textemdash" if b == 0 else f"{o/b*100:+.1f}\\%"
              latex_lines.append(f"{m} & {ct} & {b_s} & {c/1000:.1f} & {o/1000:.1f} & {pct_s} \\\\")
          total_pct_latex = r"\textemdash" if total_b == 0 else f"{total_o/total_b*100:+.1f}\\%"
          latex_lines += [
              r"\midrule",
              f"\\textbf{{Total}} & & {total_b/1000:.1f} & {total_c/1000:.1f} & {total_o/1000:.1f} & {total_pct_latex} \\\\",
              r"\bottomrule",
              r"\end{tabular}",
          ]

          with open(summary_path, "a") as out:
              out.write("## Build overhead of AOT cache creation\n\n")
              out.write("| Module | Cache Type | Baseline (s) | With Cache (s) | Overhead (s) | % Increase |\n")
              out.write("|---|---|---:|---:|---:|---:|\n")
              out.write(md_rows + "\n")
              out.write(f"| **Total** | | **{total_b/1000:.1f}** | **{total_c/1000:.1f}** | **{total_o/1000:.1f}** | **{total_pct}** |\n\n")
              out.write("```latex\n")
              out.write("\n".join(latex_lines) + "\n")
              out.write("```\n")
          EOF

          for p in batik/batik-test-old/cache.aot \
                    batik-deps/xmlgraphics-commons/cache.aot \
                    batik-deps/commons-io/cache.aot \
                    batik-deps/commons-logging-workload/cache.aot \
                    batik-deps/xml-apis-workload/cache.aot \
                    batik-deps/xml-apis-ext-workload/cache.aot \
                    tree.aot; do
            test -f "$p" || { echo "Missing: $p"; exit 1; }
          done

      # ── single.aot (Temurin — standard JDK for the no-AOT baseline) ───────

      - name: Set up JDK ${{ inputs.single_aot_jdk || '24' }} (no-AOT baseline and single.aot)
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.single_aot_jdk || '24' }}

      - name: Capture Temurin JDK path
        run: echo "TEMURIN_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Create single.aot (JDK ${{ inputs.single_aot_jdk || '24' }})
        working-directory: batik-experiment
        run: |
          set -euo pipefail
          chmod +x create-single-aot.sh
          ./create-single-aot.sh
          for op in svg-parse svg-to-png svg-to-jpeg svg-generate; do
            test -f "single-${op}.aot"
          done

      # ── Re-enable custom JDK for timed workload (needs merge capability) ──

      - name: Re-enable custom JDK
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: jdkfile
          java-version: '25'
          jdkFile: jdk-custom.tar.gz

      # ── timed workload ─────────────────────────────────────────────────────

      - name: Run timed workload
        working-directory: batik-experiment
        run: |
          set -euo pipefail
          chmod +x workload-timed.sh
          wl_out=$(JAVA_NO_BIN="$TEMURIN_JAVA_HOME/bin/java" \
                   JAVA_AOTCACHE_BIN="$TEMURIN_JAVA_HOME/bin/java" \
                   JAVA_TREECACHE_BIN="$JAVA_HOME/bin/java" \
                   ./workload-timed.sh 2>&1) || { echo "$wl_out"; exit 1; }
          echo "$wl_out"
          wl_out_clean=$(echo "$wl_out" | sed 's/\x1B\[[0-9;]*m//g')

          single_size=$(du -ch single-*.aot | tail -1 | awk '{print $1}')
          tree_size=$(du -h tree.aot | awk '{print $1}')

          {
            echo "## Timed workload results (no-AOT vs AOTCache vs TreeCache)"
            echo
            echo "- single-*.aot total: ${single_size}"
            echo "- tree.aot: ${tree_size}"
            echo
            echo '```'
            echo "$wl_out_clean"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append LaTeX table rows to summary
        working-directory: batik-experiment
        run: |
          {
            echo "## LaTeX table rows (single=AOTCache, tree=TreeCache)"
            echo
            echo '```latex'
            cat workload-tmp/latex-rows.tex
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append AOT cache composition table to summary
        working-directory: batik-experiment
        run: |
          {
            echo "## AOT cache composition (Size / Classes / App%)"
            echo
            echo '```latex'
            python3 generate-latex-table.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate UpSet overlap plot
        working-directory: batik-experiment
        run: |
          pip install --quiet upsetplot matplotlib "pandas<2.2" numpy
          python3 plot-upset.py

      # ── artifact summary ───────────────────────────────────────────────────

      - name: Write artifact summary
        working-directory: batik-experiment
        run: |
          {
            echo "## Distributed AOT artifact summary"
            echo
            echo "| Artifact | Cache path | Size |"
            echo "|---|---|---|"
            echo "| batik (test-suite) | \`batik/batik-test-old/cache.aot\` | $(du -h batik/batik-test-old/cache.aot | awk '{print $1}') |"
            echo "| xmlgraphics-commons | \`batik-deps/xmlgraphics-commons/cache.aot\` | $(du -h batik-deps/xmlgraphics-commons/cache.aot | awk '{print $1}') |"
            echo "| commons-io | \`batik-deps/commons-io/cache.aot\` | $(du -h batik-deps/commons-io/cache.aot | awk '{print $1}') |"
            echo "| commons-logging | \`batik-deps/commons-logging-workload/cache.aot\` | $(du -h batik-deps/commons-logging-workload/cache.aot | awk '{print $1}') |"
            echo "| xml-apis | \`batik-deps/xml-apis-workload/cache.aot\` | $(du -h batik-deps/xml-apis-workload/cache.aot | awk '{print $1}') |"
            echo "| xml-apis-ext | \`batik-deps/xml-apis-ext-workload/cache.aot\` | $(du -h batik-deps/xml-apis-ext-workload/cache.aot | awk '{print $1}') |"
            for op in svg-parse svg-to-png svg-to-jpeg svg-generate; do
              echo "| single-${op} | \`single-${op}.aot\` | $(du -h "single-${op}.aot" | awk '{print $1}') |"
            done
            echo "| tree | \`tree.aot\` | $(du -h tree.aot | awk '{print $1}') |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── upload ─────────────────────────────────────────────────────────────

      - name: Upload Batik workload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: batik-tree-artifacts
          path: |
            batik-experiment/workload-tmp/
            batik-experiment/build-overhead.tsv
            batik-experiment/aot.map
            batik-experiment/single-*.aot
            batik-experiment/tree.aot
            batik-experiment/batik/batik-test-old/cache.aot
            batik-experiment/batik/aot.map
            batik-experiment/batik-deps/xmlgraphics-commons/cache.aot
            batik-experiment/batik-deps/xmlgraphics-commons/aot.map
            batik-experiment/batik-deps/commons-io/cache.aot
            batik-experiment/batik-deps/commons-io/aot.map
            batik-experiment/batik-deps/commons-logging-workload/cache.aot
            batik-experiment/batik-deps/commons-logging-workload/aot.map
            batik-experiment/batik-deps/xml-apis-workload/cache.aot
            batik-experiment/batik-deps/xml-apis-workload/aot.map
            batik-experiment/batik-deps/xml-apis-ext-workload/cache.aot
            batik-experiment/batik-deps/xml-apis-ext-workload/aot.map
            batik-experiment/upset-tree-overlap.pdf
          if-no-files-found: error
