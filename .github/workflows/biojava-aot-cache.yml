name: BioJava Distributed AOT Cache

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      single_aot_jdk:
        description: 'JDK version used for single.aot and the no-AOT baseline'
        required: false
        default: '24'
        type: choice
        options:
          - '25'
          - '24'

jobs:
  tree-combine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: true

      - name: Download custom JDK
        uses: ./.github/actions/download-custom-jdk

      - name: Set up custom JDK
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: jdkfile
          java-version: '25'
          jdkFile: jdk-custom.tar.gz

      - name: Cache Maven dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-biojava-${{ hashFiles('biojava-experiment/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-biojava-
            ${{ runner.os }}-maven-

      # Install biojava-core, biojava-alignment, biojava-aa-prop, and biojava-structure
      # into the local Maven repo. biojava-aa-prop depends on biojava-structure, and
      # biojava-structure is also a direct benchmark dependency for the pdb-parse workload.
      - name: Install biojava modules into local Maven repo
        working-directory: biojava-experiment/biojava
        run: mvn install -DskipTests -q -pl biojava-core,biojava-alignment,biojava-aa-prop,biojava-structure --also-make

      # ── test-suite caches ──────────────────────────────────────────────────

      - name: Build biojava-core cache (tree-merge)
        working-directory: biojava-experiment/biojava
        run: |
          set -euo pipefail
          find biojava-core -name "*.aot" -type f -delete
          mvn clean test -Ptree-merge -pl biojava-core -q
          test -f biojava-core/cache.aot

      - name: Build biojava-alignment cache (tree-merge)
        working-directory: biojava-experiment/biojava
        run: |
          set -euo pipefail
          find biojava-alignment -name "*.aot" -type f -delete
          mvn clean test -Ptree-merge -pl biojava-alignment -q
          test -f biojava-alignment/cache.aot

      - name: Build biojava-aa-prop cache (tree-merge)
        working-directory: biojava-experiment/biojava
        run: |
          set -euo pipefail
          find biojava-aa-prop -name "*.aot" -type f -delete
          mvn clean test -Ptree-merge -pl biojava-aa-prop -q
          test -f biojava-aa-prop/cache.aot

      - name: Build biojava-structure cache (tree-merge)
        working-directory: biojava-experiment/biojava
        run: |
          set -euo pipefail
          find biojava-structure -name "*.aot" -type f -delete
          mvn clean test -Ptree-merge -pl biojava-structure -q
          test -f biojava-structure/cache.aot

      - name: Build commons-codec cache (tree-merge)
        working-directory: biojava-experiment/biojava-deps/commons-codec
        run: |
          set -euo pipefail
          find . -name "*.aot" -type f -delete
          mvn clean test -Ptree-merge -q
          test -f cache.aot

      - name: Build slf4j-api cache (tree-merge)
        working-directory: biojava-experiment/biojava-deps/slf4j
        run: |
          set -euo pipefail
          find . -name "*.aot" -type f -delete
          mvn clean test -Ptree-merge -pl slf4j-api -q
          test -f slf4j-api/cache.aot

      # ── workload cache (forester has no test suite — fat jar workload) ─────

      - name: Build and record forester-workload cache
        working-directory: biojava-experiment/biojava-deps/forester
        run: |
          set -euo pipefail
          mvn package -DskipTests -q
          java -Xlog:aot+map=trace,aot+map+oops=trace,aot=warning:file=aot.map:none:filesize=0 \
               -XX:AOTCacheOutput=cache.aot -jar target/forester-workload-fat.jar
          test -f cache.aot

      # ── benchmark fat jar ──────────────────────────────────────────────────

      - name: Build benchmark fat jar
        working-directory: biojava-experiment/benchmark
        run: mvn package -DskipTests -q

      # ── single.aot (Temurin — standard JDK for the no-AOT baseline) ───────

      - name: Set up JDK ${{ inputs.single_aot_jdk || '24' }} (no-AOT baseline and single.aot)
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.single_aot_jdk || '24' }}

      - name: Capture Temurin JDK path
        run: echo "TEMURIN_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Create single.aot (JDK ${{ inputs.single_aot_jdk || '24' }})
        working-directory: biojava-experiment
        run: |
          set -euo pipefail
          chmod +x create-single-aot.sh
          ./create-single-aot.sh
          for op in genbank-write msa aa-prop pdb-parse; do
            test -f "single-${op}.aot"
          done

      # ── tree.aot (custom JDK — has the AOT merge capability) ──────────────

      - name: Re-enable custom JDK
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: jdkfile
          java-version: '25'
          jdkFile: jdk-custom.tar.gz

      - name: Create tree.aot (orchestrate-combine.sh)
        working-directory: biojava-experiment
        run: |
          set -euo pipefail
          chmod +x orchestrate-combine.sh
          combine_out=$(./orchestrate-combine.sh 2>&1) || { echo "$combine_out"; exit 1; }
          echo "$combine_out"
          combine_out_clean=$(echo "$combine_out" | sed 's/\x1B\[[0-9;]*m//g')

          tree_size=$(du -h tree.aot | awk '{print $1}')

          {
            echo "## tree.aot creation (orchestrate-combine)"
            echo
            echo "- tree.aot: ${tree_size}"
            echo
            echo '```'
            echo "$combine_out_clean"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          test -f tree.aot

      # ── timed workload ─────────────────────────────────────────────────────

      - name: Run timed workload
        working-directory: biojava-experiment
        run: |
          set -euo pipefail
          chmod +x workload-timed.sh
          wl_out=$(JAVA_NO_BIN="$TEMURIN_JAVA_HOME/bin/java" \
                   JAVA_AOTCACHE_BIN="$TEMURIN_JAVA_HOME/bin/java" \
                   JAVA_TREECACHE_BIN="$JAVA_HOME/bin/java" \
                   ./workload-timed.sh 2>&1) || { echo "$wl_out"; exit 1; }
          echo "$wl_out"
          wl_out_clean=$(echo "$wl_out" | sed 's/\x1B\[[0-9;]*m//g')

          single_size=$(du -ch single-*.aot | tail -1 | awk '{print $1}')
          tree_size=$(du -h tree.aot | awk '{print $1}')

          {
            echo "## Timed workload results (no-AOT vs AOTCache vs TreeCache)"
            echo
            echo "- single-*.aot total: ${single_size}"
            echo "- tree.aot: ${tree_size}"
            echo
            echo '```'
            echo "$wl_out_clean"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append AOT cache composition table to summary
        working-directory: biojava-experiment
        run: |
          {
            echo "## AOT cache composition (Size / Classes / App%)"
            echo
            echo '```latex'
            python3 generate-latex-table.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append LaTeX table rows to summary
        working-directory: biojava-experiment
        run: |
          {
            echo "## LaTeX table rows (single=AOTCache, tree=TreeCache)"
            echo
            echo '```latex'
            cat workload-tmp/latex-rows.tex
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append class-load breakdown table to summary
        working-directory: biojava-experiment
        run: |
          {
            echo "## Class-load breakdown (Arch-JDK / Arch-APP / Classpath / Gen.)"
            echo
            echo '```latex'
            python3 table-classload.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── artifact summary ───────────────────────────────────────────────────

      - name: Write artifact summary
        working-directory: biojava-experiment
        run: |
          {
            echo "## Distributed AOT artifact summary"
            echo
            echo "| Artifact | Cache path | Size |"
            echo "|---|---|---|"
            echo "| biojava-core | \`biojava/biojava-core/cache.aot\` | $(du -h biojava/biojava-core/cache.aot | awk '{print $1}') |"
            echo "| biojava-alignment | \`biojava/biojava-alignment/cache.aot\` | $(du -h biojava/biojava-alignment/cache.aot | awk '{print $1}') |"
            echo "| biojava-aa-prop | \`biojava/biojava-aa-prop/cache.aot\` | $(du -h biojava/biojava-aa-prop/cache.aot | awk '{print $1}') |"
            echo "| biojava-structure | \`biojava/biojava-structure/cache.aot\` | $(du -h biojava/biojava-structure/cache.aot | awk '{print $1}') |"
            echo "| forester | \`biojava-deps/forester/cache.aot\` | $(du -h biojava-deps/forester/cache.aot | awk '{print $1}') |"
            echo "| commons-codec | \`biojava-deps/commons-codec/cache.aot\` | $(du -h biojava-deps/commons-codec/cache.aot | awk '{print $1}') |"
            echo "| slf4j-api | \`biojava-deps/slf4j/slf4j-api/cache.aot\` | $(du -h biojava-deps/slf4j/slf4j-api/cache.aot | awk '{print $1}') |"
            for op in genbank-write msa aa-prop pdb-parse; do
              echo "| single-${op} | \`single-${op}.aot\` | $(du -h "single-${op}.aot" | awk '{print $1}') |"
            done
            echo "| tree | \`tree.aot\` | $(du -h tree.aot | awk '{print $1}') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Measure build overhead
        working-directory: biojava-experiment
        run: |
          chmod +x measure-build-overhead.sh
          ./measure-build-overhead.sh

      - name: Append build overhead table to summary
        working-directory: biojava-experiment
        run: |
          {
            echo "## Build overhead (baseline vs. cache production)"
            echo
            echo '```latex'
            python3 ../report-build-overhead.py --latex build-overhead.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── upload ─────────────────────────────────────────────────────────────

      - name: Upload BioJava workload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: biojava-tree-artifacts
          path: |
            biojava-experiment/workload-tmp/
            biojava-experiment/aotlink-tree-create.log
            biojava-experiment/aot.map
            biojava-experiment/single-*.aot
            biojava-experiment/tree.aot
            biojava-experiment/biojava/biojava-core/cache.aot
            biojava-experiment/biojava/biojava-core/aot.map
            biojava-experiment/biojava/biojava-alignment/cache.aot
            biojava-experiment/biojava/biojava-alignment/aot.map
            biojava-experiment/biojava/biojava-aa-prop/cache.aot
            biojava-experiment/biojava/biojava-aa-prop/aot.map
            biojava-experiment/biojava/biojava-structure/cache.aot
            biojava-experiment/biojava/biojava-structure/aot.map
            biojava-experiment/biojava-deps/forester/cache.aot
            biojava-experiment/biojava-deps/forester/aot.map
            biojava-experiment/biojava-deps/commons-codec/cache.aot
            biojava-experiment/biojava-deps/commons-codec/aot.map
            biojava-experiment/biojava-deps/slf4j/slf4j-api/cache.aot
            biojava-experiment/biojava-deps/slf4j/slf4j-api/aot.map
          if-no-files-found: error
