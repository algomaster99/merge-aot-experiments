name: OpenNLP Morfologik AOT Cache

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      single_aot_jdk:
        description: 'JDK version used for single.aot and no-AOT baseline'
        required: false
        default: '24'
        type: choice
        options:
          - '25'
          - '24'

jobs:
  tree-combine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: false

      - name: Init opennlp submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init -- \
            opennlp-experiment/opennlp \
            opennlp-experiment/opennlp-deps/morfologik

      - name: Download custom JDK
        uses: ./.github/actions/download-custom-jdk

      - name: Set up custom JDK
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: jdkfile
          java-version: '25'
          jdkFile: jdk-custom.tar.gz

      - name: Cache Maven dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-opennlp-${{ hashFiles('opennlp-experiment/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-opennlp-
            ${{ runner.os }}-maven-

      # ── opennlp modules ──────────────────────────────────────────────────────

      - name: Install opennlp (skip tests)
        working-directory: opennlp-experiment/opennlp
        run: mvn install -DskipTests -q

      - name: Build opennlp cache files (tree-merge)
        working-directory: opennlp-experiment/opennlp
        run: |
          set -euo pipefail
          find opennlp-tools opennlp-morfologik-addon -name "*.aot" -type f -delete
          mvn clean test -Ptree-merge -pl opennlp-tools,opennlp-morfologik-addon -q
          test -f opennlp-tools/cache.aot
          test -f opennlp-morfologik-addon/cache.aot

      # ── morfologik dep modules ───────────────────────────────────────────────

      - name: Install morfologik (skip tests)
        working-directory: opennlp-experiment/opennlp-deps/morfologik
        run: mvn install -DskipTests -q

      - name: Build morfologik cache files (tree-merge)
        working-directory: opennlp-experiment/opennlp-deps/morfologik
        run: |
          set -euo pipefail
          find morfologik-fsa-builders morfologik-stemming morfologik-tools -name "*.aot" -type f -delete
          mvn clean test -Ptree-merge -pl morfologik-fsa-builders,morfologik-stemming,morfologik-tools -q
          test -f morfologik-fsa-builders/cache.aot
          test -f morfologik-stemming/cache.aot
          test -f morfologik-tools/cache.aot

      # ── CLI lib and models ────────────────────────────────────────────────────

      - name: Collect OpenNLP CLI runtime JARs
        working-directory: opennlp-experiment
        run: |
          mvn dependency:copy-dependencies \
            -f opennlp/opennlp-distr/pom.xml \
            -DoutputDirectory=opennlp-cli-lib \
            -Dscope=runtime -DincludeScope=runtime \
            -q

      - name: Extract pre-trained model files
        working-directory: opennlp-experiment
        run: |
          mkdir -p models
          for jar in ~/.m2/repository/org/apache/opennlp/opennlp-models-*/1.3.0/*.jar; do
            unzip -o "$jar" "*.bin" -d models/ -q
          done
          ls models/

      # ── single.aot (Temurin — no-AOT baseline JDK) ──────────────────────────

      - name: Set up JDK ${{ inputs.single_aot_jdk || '24' }} (no-AOT baseline and single.aot)
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.single_aot_jdk || '24' }}

      - name: Capture Temurin JDK path
        run: echo "TEMURIN_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Create single.aot (JDK ${{ inputs.single_aot_jdk || '24' }})
        working-directory: opennlp-experiment
        run: |
          set -euo pipefail
          chmod +x create-single-aot.sh
          ./create-single-aot.sh
          for op in sentdetect tokenize postag; do
            test -f "single-${op}.aot"
          done

      # ── tree.aot (custom JDK) ────────────────────────────────────────────────

      - name: Re-enable custom JDK
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: jdkfile
          java-version: '25'
          jdkFile: jdk-custom.tar.gz

      - name: Create tree.aot (orchestrate-combine.sh)
        working-directory: opennlp-experiment
        run: |
          set -euo pipefail
          combine_out=$(./orchestrate-combine.sh 2>&1) || { echo "$combine_out"; exit 1; }
          echo "$combine_out"
          combine_out_clean=$(echo "$combine_out" | sed 's/\x1B\[[0-9;]*m//g')

          tree_size=$(du -h tree.aot | awk '{print $1}')

          {
            echo "## tree.aot creation (orchestrate-combine)"
            echo
            echo "- tree.aot: ${tree_size}"
            echo
            echo '```'
            echo "$combine_out_clean"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          test -f tree.aot

      # ── timed workload ───────────────────────────────────────────────────────

      - name: Run timed workload
        working-directory: opennlp-experiment
        run: |
          set -euo pipefail
          wl_out=$(JAVA_NO_BIN="$TEMURIN_JAVA_HOME/bin/java" \
                   JAVA_AOTCACHE_BIN="$TEMURIN_JAVA_HOME/bin/java" \
                   JAVA_TREECACHE_BIN="$JAVA_HOME/bin/java" \
                   ./workload-timed.sh 2>&1) || { echo "$wl_out"; exit 1; }
          echo "$wl_out"
          wl_out_clean=$(echo "$wl_out" | sed 's/\x1B\[[0-9;]*m//g')

          single_size=$(du -ch single-*.aot | tail -1 | awk '{print $1}')
          tree_size=$(du -h tree.aot | awk '{print $1}')

          {
            echo "## Timed workload results (no-AOT vs AOTCache vs TreeCache)"
            echo
            echo "- single-*.aot total: ${single_size}"
            echo "- tree.aot: ${tree_size}"
            echo
            echo '```'
            echo "$wl_out_clean"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append LaTeX table rows to summary
        working-directory: opennlp-experiment
        run: |
          {
            echo "## LaTeX table rows (single=AOTCache, tree=TreeCache)"
            echo
            echo '```latex'
            cat workload-tmp/latex-rows.tex
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write artifact summary
        working-directory: opennlp-experiment
        run: |
          {
            echo "## Distributed AOT artifact summary"
            echo
            echo "| Artifact | Cache path | Size |"
            echo "|---|---|---|"
            echo "| opennlp-tools | \`opennlp/opennlp-tools/cache.aot\` | $(du -h opennlp/opennlp-tools/cache.aot | awk '{print $1}') |"
            echo "| opennlp-morfologik-addon | \`opennlp/opennlp-morfologik-addon/cache.aot\` | $(du -h opennlp/opennlp-morfologik-addon/cache.aot | awk '{print $1}') |"
            echo "| morfologik-fsa-builders | \`opennlp-deps/morfologik/morfologik-fsa-builders/cache.aot\` | $(du -h opennlp-deps/morfologik/morfologik-fsa-builders/cache.aot | awk '{print $1}') |"
            echo "| morfologik-stemming | \`opennlp-deps/morfologik/morfologik-stemming/cache.aot\` | $(du -h opennlp-deps/morfologik/morfologik-stemming/cache.aot | awk '{print $1}') |"
            echo "| morfologik-tools | \`opennlp-deps/morfologik/morfologik-tools/cache.aot\` | $(du -h opennlp-deps/morfologik/morfologik-tools/cache.aot | awk '{print $1}') |"
            for op in sentdetect tokenize postag; do
              echo "| single-${op} | \`single-${op}.aot\` | $(du -h "single-${op}.aot" | awk '{print $1}') |"
            done
            echo "| tree | \`tree.aot\` | $(du -h tree.aot | awk '{print $1}') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OpenNLP workload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: opennlp-tree-artifacts
          path: |
            opennlp-experiment/workload-tmp/
            opennlp-experiment/single-sentdetect.aot
            opennlp-experiment/single-tokenize.aot
            opennlp-experiment/single-postag.aot
            opennlp-experiment/tree.aot
            opennlp-experiment/opennlp/opennlp-tools/cache.aot
            opennlp-experiment/opennlp/opennlp-tools/aot.map
            opennlp-experiment/opennlp/opennlp-morfologik-addon/cache.aot
            opennlp-experiment/opennlp/opennlp-morfologik-addon/aot.map
            opennlp-experiment/opennlp-deps/morfologik/morfologik-fsa-builders/cache.aot
            opennlp-experiment/opennlp-deps/morfologik/morfologik-fsa-builders/aot.map
            opennlp-experiment/opennlp-deps/morfologik/morfologik-stemming/cache.aot
            opennlp-experiment/opennlp-deps/morfologik/morfologik-stemming/aot.map
            opennlp-experiment/opennlp-deps/morfologik/morfologik-tools/cache.aot
            opennlp-experiment/opennlp-deps/morfologik/morfologik-tools/aot.map
          if-no-files-found: error
