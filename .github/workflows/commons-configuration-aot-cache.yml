name: Commons Configuration Distributed AOT Cache

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      single_aot_jdk:
        description: 'JDK version used for single.aot'
        required: false
        default: '24'
        type: choice
        options:
          - '25'
          - '24'

jobs:
  tree-combine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: true

      - name: Download custom JDK
        uses: ./.github/actions/download-custom-jdk

      - name: Set up custom JDK
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: jdkfile
          java-version: '25'
          jdkFile: jdk-custom.tar.gz

      - name: Cache Maven dependencies
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build commons-lang3 cache (tree-merge)
        working-directory: commons-configuration-experiment/commons-configuration-deps/commons-lang
        run: |
          set -euo pipefail
          find . -name "*.aot" -type f -delete
          mvn clean test -Ptree-merge -q
          test -f cache.aot

      - name: Build commons-text cache (tree-merge)
        working-directory: commons-configuration-experiment/commons-configuration-deps/commons-text
        run: |
          set -euo pipefail
          find . -name "*.aot" -type f -delete
          mvn clean test -Ptree-merge -q
          test -f cache.aot

      - name: Build commons-beanutils cache (tree-merge)
        working-directory: commons-configuration-experiment/commons-configuration-deps/commons-beanutils
        run: |
          set -euo pipefail
          find . -name "*.aot" -type f -delete
          mvn clean test -Ptree-merge -q
          test -f cache.aot

      - name: Build commons-collections cache (tree-merge)
        working-directory: commons-configuration-experiment/commons-configuration-deps/commons-collections
        run: |
          set -euo pipefail
          find . -name "*.aot" -type f -delete
          mvn clean test -Ptree-merge -Dmaven.test.failure.ignore=true -q
          test -f cache.aot

      - name: Build commons-logging cache (workload jar)
        working-directory: commons-configuration-experiment/commons-configuration-deps/commons-logging-workload
        run: |
          set -euo pipefail
          mvn package -q
          java -Xlog:aot+map=trace,aot+map+oops=trace,aot=warning:file=aot.map:none:filesize=0 \
            -XX:AOTCacheOutput=cache.aot \
            --add-opens java.base/java.io=ALL-UNNAMED \
            --add-opens java.base/java.lang=ALL-UNNAMED \
            --add-opens java.base/java.lang.reflect=ALL-UNNAMED \
            --add-opens java.base/java.time=ALL-UNNAMED \
            --add-opens java.base/java.time.chrono=ALL-UNNAMED \
            --add-opens java.base/java.util=ALL-UNNAMED \
            -jar target/commons-logging-workload-1.0-SNAPSHOT.jar
          test -f cache.aot

      - name: Build commons-configuration cache (tree-merge)
        working-directory: commons-configuration-experiment/commons-configuration
        run: |
          set -euo pipefail
          find . -name "*.aot" -type f -delete
          mvn clean test -Ptree-merge -q
          test -f cache.aot

      - name: Build benchmark fat jar
        working-directory: commons-configuration-experiment/benchmark
        run: mvn package -DskipTests -q

      - name: Set up JDK ${{ inputs.single_aot_jdk }} (no-AOT baseline and single.aot)
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.single_aot_jdk || '24' }}

      - name: Capture Temurin JDK path
        run: echo "TEMURIN_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Create single.aot (JDK ${{ inputs.single_aot_jdk || '24' }})
        working-directory: commons-configuration-experiment
        run: |
          set -euo pipefail
          chmod +x create-single-aot.sh
          ./create-single-aot.sh
          for op in properties-read xml-read composite-read interpolation; do
            test -f "single-${op}.aot"
          done

      - name: Re-enable custom JDK
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: jdkfile
          java-version: '25'
          jdkFile: jdk-custom.tar.gz

      - name: Create tree.aot (orchestrate-combine.sh)
        working-directory: commons-configuration-experiment
        run: |
          set -euo pipefail
          chmod +x orchestrate-combine.sh
          combine_out=$(./orchestrate-combine.sh 2>&1) || { echo "$combine_out"; exit 1; }
          echo "$combine_out"
          combine_out_clean=$(echo "$combine_out" | sed 's/\x1B\[[0-9;]*m//g')

          tree_size=$(du -h tree.aot | awk '{print $1}')

          {
            echo "## tree.aot creation (orchestrate-combine)"
            echo
            echo "- tree.aot: ${tree_size}"
            echo
            echo '```'
            echo "$combine_out_clean"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          test -f tree.aot

      - name: Run timed workload
        working-directory: commons-configuration-experiment
        run: |
          set -euo pipefail
          chmod +x workload-timed.sh
          wl_out=$(JAVA_NO_BIN="$TEMURIN_JAVA_HOME/bin/java" JAVA_AOTCACHE_BIN="$TEMURIN_JAVA_HOME/bin/java" JAVA_TREECACHE_BIN="$JAVA_HOME/bin/java" ./workload-timed.sh 2>&1) || { echo "$wl_out"; exit 1; }
          echo "$wl_out"
          wl_out_clean=$(echo "$wl_out" | sed 's/\x1B\[[0-9;]*m//g')

          single_size=$(du -ch single-*.aot | tail -1 | awk '{print $1}')
          tree_size=$(du -h tree.aot | awk '{print $1}')

          {
            echo "## Timed workload results (no-AOT vs AOTCache vs TreeCache)"
            echo
            echo "- single-*.aot total: ${single_size}"
            echo "- tree.aot: ${tree_size}"
            echo
            echo '```'
            echo "$wl_out_clean"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append LaTeX table rows to summary
        working-directory: commons-configuration-experiment
        run: |
          {
            echo "## LaTeX table rows (single=AOTCache, tree=TreeCache)"
            echo
            echo '```latex'
            cat workload-tmp/latex-rows.tex
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append AOT cache composition table to summary
        working-directory: commons-configuration-experiment
        run: |
          {
            echo "## AOT cache composition (Size / Classes / App%)"
            echo
            echo '```latex'
            python3 generate-latex-table.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write artifact summary
        working-directory: commons-configuration-experiment
        run: |
          set -euo pipefail

          {
            echo "## Distributed AOT artifact summary"
            echo
            echo "| Artifact | Cache path | Size |"
            echo "|---|---|---|"
            echo "| commons-lang3 | \`commons-configuration-deps/commons-lang/cache.aot\` | $(du -h commons-configuration-deps/commons-lang/cache.aot | awk '{print $1}') |"
            echo "| commons-text | \`commons-configuration-deps/commons-text/cache.aot\` | $(du -h commons-configuration-deps/commons-text/cache.aot | awk '{print $1}') |"
            echo "| commons-beanutils | \`commons-configuration-deps/commons-beanutils/cache.aot\` | $(du -h commons-configuration-deps/commons-beanutils/cache.aot | awk '{print $1}') |"
            echo "| commons-collections | \`commons-configuration-deps/commons-collections/cache.aot\` | $(du -h commons-configuration-deps/commons-collections/cache.aot | awk '{print $1}') |"
            echo "| commons-logging | \`commons-configuration-deps/commons-logging-workload/cache.aot\` | $(du -h commons-configuration-deps/commons-logging-workload/cache.aot | awk '{print $1}') |"
            echo "| commons-configuration | \`commons-configuration/cache.aot\` | $(du -h commons-configuration/cache.aot | awk '{print $1}') |"
            for op in properties-read xml-read composite-read interpolation; do
              echo "| single-${op} | \`single-${op}.aot\` | $(du -h "single-${op}.aot" | awk '{print $1}') |"
            done
            echo "| tree | \`tree.aot\` | $(du -h tree.aot | awk '{print $1}') |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Commons Configuration workload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: commons-configuration-tree-artifacts
          path: |
            commons-configuration-experiment/workload-tmp/
            commons-configuration-experiment/aot.map
            commons-configuration-experiment/single-*.aot
            commons-configuration-experiment/tree.aot
            commons-configuration-experiment/commons-configuration/cache.aot
            commons-configuration-experiment/commons-configuration/aot.map
            commons-configuration-experiment/commons-configuration-deps/commons-lang/cache.aot
            commons-configuration-experiment/commons-configuration-deps/commons-lang/aot.map
            commons-configuration-experiment/commons-configuration-deps/commons-text/cache.aot
            commons-configuration-experiment/commons-configuration-deps/commons-text/aot.map
            commons-configuration-experiment/commons-configuration-deps/commons-beanutils/cache.aot
            commons-configuration-experiment/commons-configuration-deps/commons-beanutils/aot.map
            commons-configuration-experiment/commons-configuration-deps/commons-collections/cache.aot
            commons-configuration-experiment/commons-configuration-deps/commons-collections/aot.map
            commons-configuration-experiment/commons-configuration-deps/commons-logging-workload/cache.aot
            commons-configuration-experiment/commons-configuration-deps/commons-logging-workload/aot.map
          if-no-files-found: error
